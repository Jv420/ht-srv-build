  - action: move_path
    src: ./tmp/hextactics_crime/server.cfg
    dest: ./server.cfg
    overwrite: true

  - action: copy_path
    src: ./tmp/hextactics_crime/INSTALLATIE_NITRADO.md
    dest: ./INSTALLATIE_NITRADO_CRIME.md
    overwrite: true

  - action: copy_path
    src: ./tmp/hextactics_crime/THIRD_PARTY.md
    dest: ./THIRD_PARTY_CRIME.md
    overwrite: true

  - action: copy_path
    src: ./tmp/hextactics_crime/SECURITY.md
    dest: ./SECURITY_CRIME.md
    overwrite: true

  - action: remove_path
    path: ./tmp
