$engine: 3
$onesync: 'on'

name: Delfzijl | HexTactics Crime Edition
author: HexTactics
version: 1.0.0
description: Geoptimaliseerde ESX Crime Edition voor maximaal 20 spelers met Vehicle Suite, overvallen, smokkel, gangs, zwarte markt, bewijs en gevangenis.

tasks:
  - action: connect_database

  - action: download_github
    src: citizenfx/cfx-server-data
    ref: e265cb251c88260533c847d4a1a2838c7d828a66
    subpath: resources
    dest: ./resources

  - action: download_github
    src: esx-framework/esx_core
    ref: 220a1bf0284c082c0956a423aacba8f1aed1ee10
    dest: ./tmp/esx_core

  - action: query_database
    file: ./tmp/esx_core/[SQL]/legacy.sql

  - action: move_path
    src: ./tmp/esx_core/[core]
    dest: ./resources/[core]
    overwrite: true

  - action: remove_path
    path: ./resources/[core]/esx_inventory

  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.1/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/download/v3.35.0/ox_lib.zip
    path: ./tmp/ox_lib.zip

  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_target/releases/download/v1.18.1/ox_target.zip
    path: ./tmp/ox_target.zip

  - action: unzip
    src: ./tmp/ox_target.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_inventory/releases/download/v2.47.1/ox_inventory.zip
    path: ./tmp/ox_inventory.zip

  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_doorlock/releases/download/v1.22.1/ox_doorlock.zip
    path: ./tmp/ox_doorlock.zip

  - action: unzip
    src: ./tmp/ox_doorlock.zip
    dest: ./resources/[ox]

  - action: download_github
    src: Bob74/bob74_ipl
    ref: c229e65d6cd7bbe3942c619c12d8197f89247762
    dest: ./resources/[standalone]/bob74_ipl

  - action: download_github
    src: Jv420/ht-srv-build
    ref: 4d414d1482a5108528b897f4cab4a6b6d80e6900
    subpath: hextactics_deploy
    dest: ./tmp/hextactics_base

  - action: move_path
    src: ./tmp/hextactics_base/resources/[HexTactics]
    dest: ./resources/[HexTactics]
    overwrite: true

  - action: query_database
    file: ./tmp/hextactics_base/installer/database.sql

  - action: query_database
    file: ./tmp/hextactics_base/installer/optional_rdw_job.sql

  - action: download_github
    src: Jv420/ht-srv-build
    ref: 36b7b622638223bbb0a601387a40872407771094
    subpath: hextactics_crime_deploy
    dest: ./tmp/hextactics_crime

  - action: move_path
    src: ./tmp/hextactics_crime/resources/[HexTactics-Crime]
    dest: ./resources/[HexTactics-Crime]
    overwrite: true

  - action: query_database
    file: ./tmp/hextactics_crime/installer/database.sql

  - action: replace_string
    file: ./resources/[ox]/ox_inventory/data/items.lua
    search: 'return {'
    replace: |-
      return {
          ['plate_blank'] = { label = 'Blanco kentekenplaat', weight = 800, stack = true, close = true, description = 'Onbedrukte plaat voor voertuigregistratie.' },
