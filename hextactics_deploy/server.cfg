# ============================================================
# Delfzijl | HexTactics - txAdmin/Nitrado server.cfg
# Gegenereerd voor de HexTactics Vehicle Suite en NPC-roleplay.
# ============================================================

{{serverEndpoints}}

sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{addPrincipalsMaster}}

sv_hostname "{{serverName}}"
sets sv_projectName "Delfzijl | HexTactics"
sets sv_projectDesc "Nederlandse ESX Legacy roleplay met eigen voertuigen, RDW en NPC-roleplay"
sets locale "nl-NL"
sets tags "nl, nederlands, roleplay, esx, hextactics, delfzijl"

# Database wordt door de txAdmin Server Deployer ingevuld.
set mysql_connection_string "{{dbConnectionString}}"

# OneSync wordt door de recipe op ON gezet.
set sv_stateBagStrictMode true
set sv_filterRequestControl 2
set sv_enableNetworkedSounds false
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedScriptEntityStates true
set sv_experimentalNetGameEventHandler true

# GTA-build: beheer dit via txAdmin/Nitrado wanneer jouw artifact
# en eventuele FiveM Enhanced-installatie daarvoor geschikt zijn.
# sv_enforceGameBuild <buildnummer>

# Nederlandse taal en ox-configuratie.
setr esx:locale "nl"
setr ox:locale "nl"
setr inventory:framework "esx"
setr inventory:target true
setr inventory:slots 50
setr inventory:weight 30000

# Cfx standaardresources.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure basic-gamemode

# Database en libraries: deze volgorde niet wijzigen.
ensure oxmysql
ensure ox_lib

# ESX Legacy core. De recipe verwijdert esx_inventory omdat ox_inventory actief is.
ensure [core]

# ox-resources.
ensure ox_target
ensure ox_inventory

# LC Fuel is een eigen/escrow-resource en kan niet legaal uit deze publieke
# repository worden gedownload. Upload hem handmatig en haal daarna het # weg:
# ensure lc_fuel

# HexTactics basis.
ensure hextactics_core
ensure ht_vehiclekeys
ensure ht_rdw
ensure ht_chopshop
ensure ht_customdealer
ensure hextactics_vehicle_bridge
ensure hextactics_npc_roleplay
ensure hextactics_startup_check


# Adminbevoegdheid voor /hextacticscheck.
add_ace group.admin hextactics.admin allow

# Niet tegelijk starten met deze basis:
# ox_fuel, LegacyFuel, esx_inventory, p_vehiclekeys, idev_keys,
# esx_garage, zerodream_parking, iwa_policejob.
