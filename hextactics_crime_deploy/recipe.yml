          ['stolen_jewelry'] = { label = 'Gestolen sieraden', weight = 250, stack = true, close = false },
          ['stolen_art'] = { label = 'Gestolen kunstobject', weight = 2200, stack = true, close = false },
          ['vehicle_ecu'] = { label = 'Gestolen voertuig-ECU', weight = 1200, stack = true, close = false },
          ['catalytic_converter'] = { label = 'Katalysator', weight = 4200, stack = true, close = false },
          ['contraband_crate'] = { label = 'Verzegelde smokkelkist', weight = 8000, stack = false, close = false },
          ['plant_cuttings'] = { label = 'Plantenstekken', weight = 100, stack = true, close = false },
          ['chemical_supplies'] = { label = 'Chemische benodigdheden', weight = 750, stack = true, close = false, description = 'Fictieve roleplay-grondstoffen.' },
