# ============================================================
# Delfzijl | HexTactics - txAdmin/Nitrado server.cfg
# ============================================================
{{serverEndpoints}}
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{addPrincipalsMaster}}

sv_hostname "{{serverName}}"
sets sv_projectName "Delfzijl | HexTactics"
sets sv_projectDesc "Nederlandse ESX Legacy roleplay met eigen voertuigen, RDW en NPC-roleplay"
sets locale "nl-NL"
sets tags "nl,nederlands,roleplay,esx,hextactics,delfzijl"
sets Discord "https://discord.gg/cnbhkHphay"
set mysql_connection_string "{{dbConnectionString}}"
set resources_useSystemChat true

# OneSync/security
set sv_stateBagStrictMode true
set sv_filterRequestControl 2
set sv_enableNetworkedSounds false
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedScriptEntityStates true
set sv_experimentalNetGameEventHandler true

# ESX/OX
setr esx:locale "nl"
setr ox:locale "nl"
setr inventory:framework "esx"
setr inventory:target true
setr inventory:slots 50
setr inventory:weight 30000

# Discord: vul token en server-ID uitsluitend lokaal in.
set ht_discord:enabled "false"
set ht_discord:guildId ""
set ht_discord:botToken ""
set ht_discord:invite "https://discord.gg/cnbhkHphay"
add_convar_permission ht_discord read ht_discord:botToken

# Officiële ESX ACE-rechten en ht_discord-sessierechten
add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
add_ace resource.ht_discord command.add_principal allow
add_ace resource.ht_discord command.remove_principal allow
add_ace group.admin hextactics.admin allow

# Discordrol -> HexTactics-rechten
add_ace group.ht_staff hextactics.staff allow
add_ace group.ht_moderator hextactics.moderator allow
add_ace group.ht_support hextactics.support allow
add_ace group.ht_developer hextactics.developer allow
add_ace group.ht_beta hextactics.beta allow
add_ace group.ht_creator hextactics.creator allow
add_ace group.ht_police hextactics.job.police allow
add_ace group.ht_ambulance hextactics.job.ambulance allow
add_ace group.ht_anwb hextactics.job.anwb allow
add_ace group.ht_business hextactics.business allow
add_ace group.ht_whitelisted hextactics.whitelisted allow

# ESX Legacy gebruikt eigen multicharacter/spawnflow.
stop mapmanager
stop basic-gamemode
stop fivem-map-skater

ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

ensure oxmysql
ensure ox_lib

# ESX Legacy in vaste dependency-volgorde
ensure cron
ensure es_extended
ensure esx_chat_theme
ensure esx_context
ensure esx_identity
ensure esx_lib
ensure esx_loadingscreen
ensure esx_menu_default
ensure esx_menu_dialog
ensure esx_menu_list
ensure skinchanger
ensure esx_skin
ensure esx_multicharacter
ensure esx_notify
ensure esx_progressbar
ensure esx_textui

ensure ox_target
ensure ox_inventory

# Upload LC Fuel handmatig en start utils vóór fuel.
# ensure lc_utils
# ensure lc_fuel

ensure hextactics_core
ensure ht_discord
ensure ht_vehiclekeys
ensure ht_rdw
ensure ht_chopshop
ensure ht_customdealer
ensure hextactics_vehicle_bridge
ensure hextactics_npc_roleplay
ensure hextactics_startup_check
