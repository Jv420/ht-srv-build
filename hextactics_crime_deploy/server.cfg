# ============================================================
# Delfzijl | HexTactics Crime Edition - max. 20 spelers
# ============================================================
{{serverEndpoints}}
sv_licenseKey "{{svLicense}}"
sv_maxclients 20
{{addPrincipalsMaster}}

sv_hostname "{{serverName}}"
sets sv_projectName "Delfzijl | HexTactics Crime Edition"
sets sv_projectDesc "Nederlandse ESX Crime RP met voertuigdiefstal, omkatten, smokkel, drugs, gangs en dynamische politiealerts"
sets locale "nl-NL"
sets tags "nl,nederlands,crime,roleplay,esx,hextactics,delfzijl,gangs,robbery"
set mysql_connection_string "{{dbConnectionString}}"

# OneSync/security
set sv_stateBagStrictMode true
set sv_filterRequestControl 2
set sv_enableNetworkedSounds false
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedScriptEntityStates true
set sv_experimentalNetGameEventHandler true
setr onesync_population true

# ESX/OX
setr esx:locale "nl"
setr ox:locale "nl"
setr inventory:framework "esx"
setr inventory:target true
setr inventory:slots 55
setr inventory:weight 35000
setr ox_target:defaultHotkey "LMENU"

# ESX 1.14 gebruikt eigen spawning/multicharacter.
# Start mapmanager, basic-gamemode en fivem-map-skater NIET.
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

ensure oxmysql
ensure ox_lib
ensure [core]
ensure ox_target
ensure ox_inventory
ensure ox_doorlock
ensure bob74_ipl

# LC resources moeten exact zo heten en in deze volgorde starten.
ensure lc_utils
ensure lc_fuel

# HexTactics basis
ensure hextactics_core
ensure ht_vehiclekeys
ensure ht_rdw
ensure ht_chopshop
ensure ht_customdealer
ensure hextactics_vehicle_bridge
ensure hextactics_npc_roleplay

# Crime Edition
ensure hextactics_crime_suite
ensure hextactics_startup_check

add_ace group.admin hextactics.admin allow
add_ace group.admin command.doorlock allow
