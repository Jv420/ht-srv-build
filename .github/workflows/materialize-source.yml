name: Materialize HexTactics source

on:
  push:
    branches:
      - agent/import-hextactics-source
    paths:
      - tools/materialize_source.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate loose source files
        run: python3 tools/materialize_source.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore THIRD_PARTY_RESOURCES.md installer resources
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi
          git commit -m "Import HexTactics source resources"
          git push
