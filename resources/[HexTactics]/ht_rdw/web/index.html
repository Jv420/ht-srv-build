<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDW / APK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="panel">
    <header>
      <div class="brand">
        <h1>HexTactics RDW</h1>
        <p>APK, verzekering, tenaamstelling en boetes</p>
      </div>
      <button id="close">Sluiten</button>
    </header>
    <main>
      <div id="vehicle" class="card"></div>
      <div class="actions" id="vehicleActions">
        <button id="inspect">Register bekijken</button>
        <button id="apk" class="good">APK keuren</button>
        <button id="insurance">Verzekering afsluiten</button>
        <button id="register">Tenaamstellen</button>
      </div>
      <h3>Openstaande boetes</h3>
      <div id="fines" class="grid"></div>
    </main>
  </section>
  <script src="app.js"></script>
</body>
</html>
