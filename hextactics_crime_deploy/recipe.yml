          ['radio_scanner'] = { label = 'Politiescanner', weight = 650, stack = false, close = true },
          ['plate_press'] = { label = 'Kentekenpers', weight = 3500, stack = false, close = true },
          ['tracker_scrambler'] = { label = 'Trackerstoorzender', weight = 800, stack = false, close = true },
          ['wire_cutter'] = { label = 'Industriele kniptang', weight = 1400, stack = false, close = true },
          ['crime_gloves'] = { label = 'Forensische handschoenen', weight = 100, stack = true, close = true },
