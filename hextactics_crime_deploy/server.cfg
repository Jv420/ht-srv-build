# ============================================================
# Delfzijl | HexTactics Crime Edition - max. 20 spelers
# ============================================================
{{serverEndpoints}}
sv_licenseKey "{{svLicense}}"
sv_maxclients 20
{{addPrincipalsMaster}}

sv_hostname "{{serverName}}"
sets sv_projectName "Delfzijl | HexTactics Crime Edition"
sets sv_projectDesc "Nederlandse ESX Crime RP met voertuigdiefstal, omkatten, smokkel, gangs en dynamische politiealerts"
sets locale "nl-NL"
sets tags "nl,nederlands,crime,roleplay,esx,hextactics,delfzijl,gangs,robbery"
set mysql_connection_string "{{dbConnectionString}}"
set resources_useSystemChat true

# OneSync/security
set sv_stateBagStrictMode true
set sv_filterRequestControl 2
set sv_enableNetworkedSounds false
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedScriptEntityStates true
set sv_experimentalNetGameEventHandler true
setr onesync_population true

# ESX/OX
setr esx:locale "nl"
setr ox:locale "nl"
setr inventory:framework "esx"
setr inventory:target true
setr inventory:slots 55
setr inventory:weight 35000
setr ox_target:defaultHotkey "LMENU"

# ============================================================
# ACE - MOET VOOR ESX WORDEN INGELADEN
# ============================================================
add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow
add_ace group.admin hextactics.admin allow
add_ace group.admin command.doorlock allow

# ============================================================
# Verwijder/stop standaard gamemode-resources die ESX 1.14 breken
# ============================================================
stop mapmanager
stop basic-gamemode
stop fivem-map-skater

# FiveM-basis zonder gamemode/mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap

# Database en libraries
ensure oxmysql
ensure ox_lib

# ESX Legacy 1.14 in vaste dependency-volgorde
ensure cron
ensure es_extended
ensure esx_chat_theme
ensure esx_context
ensure esx_identity
ensure esx_lib
ensure esx_loadingscreen
ensure esx_menu_default
ensure esx_menu_dialog
ensure esx_menu_list
ensure skinchanger
ensure esx_skin
ensure esx_multicharacter
ensure esx_notify
ensure esx_progressbar
ensure esx_textui

# OX gameplay
ensure ox_target
ensure ox_inventory
ensure ox_doorlock
ensure bob74_ipl

# LC resources: utils -> fuel -> bridge
ensure lc_utils
ensure lc_fuel

# HexTactics basis
ensure hextactics_core
ensure ht_vehiclekeys
ensure ht_rdw
ensure ht_chopshop
ensure ht_customdealer
ensure hextactics_vehicle_bridge
ensure hextactics_npc_roleplay

# Joinflow-bewaking en Crime Edition
ensure hextactics_spawn_guard
ensure hextactics_crime_suite
ensure hextactics_startup_check
